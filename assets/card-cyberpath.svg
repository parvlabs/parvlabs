<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%">
  <defs>
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a07" />
      <stop offset="50%" stop-color="#14100a" />
      <stop offset="100%" stop-color="#070605" />
    </linearGradient>
    <pattern id="grid-c" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>
  <rect width="850" height="180" rx="8" fill="url(#bg-cyber)" />
  <rect width="850" height="180" rx="8" fill="url(#grid-c)" />
  <rect x="0.5" y="0.5" width="849" height="179" rx="7.5" fill="none" stroke="#382d1c" stroke-width="1.2" />
  <path d="M 0 0 L 850 0" stroke="#f59e0b" stroke-width="2.5" />
  
  <g transform="translate(25, 24)">
    <!-- Title -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="18" font-weight="800" fill="#fbbf24">
      ◈ CyberPath — AI Cybersecurity Assessment &amp; Mentorship (SIH26101)
    </text>
    
    <!-- One line pitch -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="13" font-weight="400" fill="#c5beb4">
      Diagnostic cybersecurity education platform featuring competency mapping, generative AI threat simulations,
    </text>
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="13" font-weight="400" fill="#c5beb4">
      and dynamic career track alignment built as an ultra-fast Vanilla JS SPA.
    </text>
    
    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 84)">
      <rect width="90" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
      <text x="45" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">JavaScript</text>
      
      <g transform="translate(96, 0)">
        <rect width="96" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="48" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">HTML5 Canvas</text>
      </g>
      <g transform="translate(198, 0)">
        <rect width="52" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="26" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">CSS3</text>
      </g>
      <g transform="translate(256, 0)">
        <rect width="84" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="42" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Gemini API</text>
      </g>
      <g transform="translate(346, 0)">
        <rect width="74" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="37" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Firebase</text>
      </g>
    </g>

    <!-- Links / Status -->
    <g transform="translate(0, 116)">
      <rect width="130" height="20" rx="4" fill="#1c160c" stroke="#f59e0b" stroke-opacity="0.4" />
      <text x="65" y="14" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="middle">📁 CyberPath Repo</text>
      
      <g transform="translate(138, 0)">
        <rect width="145" height="20" rx="4" fill="#1c160c" stroke="#f59e0b" stroke-opacity="0.4" />
        <text x="72" y="14" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="middle">⚡ Live Platform ↗</text>
      </g>
    </g>
