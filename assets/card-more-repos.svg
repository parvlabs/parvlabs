<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%">
  <defs>
    <linearGradient id="bg-mr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a07" />
      <stop offset="50%" stop-color="#14100a" />
      <stop offset="100%" stop-color="#070605" />
    </linearGradient>
  </defs>
  <rect width="850" height="145" rx="8" fill="url(#bg-mr)" />
  <rect x="0.5" y="0.5" width="849" height="144" rx="7.5" fill="none" stroke="#382d1c" stroke-width="1.2" />
  
  <!-- Row 1: Advance Student Management System -->
  <g transform="translate(25, 25)">
    <circle cx="6" cy="10" r="3" fill="#f59e0b" />
    <text x="18" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#fbbf24">
      Advance-Student-Management-System
    </text>
    <g transform="translate(320, 0)">
      <rect width="130" height="20" rx="4" fill="#1c160c" stroke="#382d1c" />
      <text x="65" y="14" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#f59e0b" text-anchor="middle">Python • SQLite • GUI</text>
    </g>
    <text x="18" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c5beb4">
      Transactional CRUD database engine with automated reporting and audit logs.
    </text>
  </g>

  <!-- Divider -->
  <line x1="25" y1="76" x2="825" y2="76" stroke="#262016" stroke-width="1" />

  <!-- Row 2: Portfolio -->
  <g transform="translate(25, 90)">
    <circle cx="6" cy="10" r="3" fill="#f59e0b" />
    <text x="18" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#fbbf24">
      portfolio (parvlabs.in)
    </text>
    <g transform="translate(320, 0)">
      <rect width="130" height="20" rx="4" fill="#1c160c" stroke="#382d1c" />
      <text x="65" y="14" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#f59e0b" text-anchor="middle">HTML5 • CSS3 • JS</text>
    </g>
    <text x="18" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c5beb4">
