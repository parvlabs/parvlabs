<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070605" />
      <stop offset="50%" stop-color="#0d0b08" />
      <stop offset="100%" stop-color="#070605" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amber-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17140e" />
      <stop offset="100%" stop-color="#0c0a07" />
    </linearGradient>
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="900" height="210" rx="10" fill="url(#obsidian-bg)" />
  <rect width="900" height="210" rx="10" fill="url(#cyber-grid)" />
  
  <!-- Outer Frame & Top Amber Accent Glow -->
  <rect x="0.5" y="0.5" width="899" height="209" rx="9.5" fill="none" stroke="#262118" stroke-width="1" />
  <path d="M 0 0 L 900 0" stroke="url(#amber-glow)" stroke-width="3.5" rx="2" />
  <circle cx="450" cy="0" r="180" fill="#f59e0b" fill-opacity="0.03" filter="url(#glow)" />

  <!-- Monogram Brand Node -->
  <g transform="translate(56, 55)">
    <rect width="100" height="100" rx="18" fill="url(#amber-card-bg)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.75" />
    <text x="50" y="61" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="36" font-weight="800" fill="#fbbf24" text-anchor="middle" dominant-baseline="central">P/</text>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.4" />
  </g>

  <!-- Typography Hierarchy -->
  <g transform="translate(182, 0)">
    <!-- Terminal Prompt Pill -->
    <g transform="translate(0, 48)">
      <rect width="210" height="22" rx="6" fill="#1c160c" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="10" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="1">
        ✦ PARV LABS // SEC_CORE
      </text>
    </g>
    
    <!-- Primary Heading -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#fbfaf8" letter-spacing="-0.6">
      Parv <tspan font-weight="400" fill="#c5beb4" font-size="22">(@parvlabs)</tspan>
    </text>
    
    <!-- Subtitle / Discipline -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="15" font-weight="500" fill="#c5beb4">
      Backend Architecture <tspan fill="#f59e0b">•</tspan> Defensive Security <tspan fill="#f59e0b">•</tspan> Autonomous Systems
    </text>
  </g>

  <!-- Right Telemetry Beacon -->
  <g transform="translate(735, 68)">
    <rect width="112" height="32" rx="8" fill="#18130a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.5">ONLINE</text>
  </g>
</svg>
