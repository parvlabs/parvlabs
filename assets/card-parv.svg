<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%">
  <defs>
    <linearGradient id="bg-parv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a07" />
      <stop offset="50%" stop-color="#14100a" />
      <stop offset="100%" stop-color="#070605" />
    </linearGradient>
    <pattern id="grid-p" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>
  <rect width="850" height="180" rx="8" fill="url(#bg-parv)" />
  <rect width="850" height="180" rx="8" fill="url(#grid-p)" />
  <rect x="0.5" y="0.5" width="849" height="179" rx="7.5" fill="none" stroke="#382d1c" stroke-width="1.2" />
  <path d="M 0 0 L 850 0" stroke="#f59e0b" stroke-width="2.5" />
  
  <g transform="translate(25, 24)">
    <!-- Title -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="18" font-weight="800" fill="#fbbf24">
      ◈ PARV v5.0 — Autonomous 3D Holographic AI Assistant
    </text>
    
    <!-- One line pitch -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="13" font-weight="400" fill="#c5beb4">
      Autonomous desktop AI assistant &amp; cyber visualizer with gesture control, multi-LLM cascade routing,
    </text>
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="13" font-weight="400" fill="#c5beb4">
      computer-use automation, and a zero-trust execution sandbox.
    </text>
    
    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 84)">
      <rect width="70" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
      <text x="35" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Python</text>
      
      <g transform="translate(76, 0)">
        <rect width="60" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="30" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">PyQt6</text>
      </g>
      <g transform="translate(142, 0)">
        <rect width="74" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="37" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Three.js</text>
      </g>
      <g transform="translate(222, 0)">
        <rect width="84" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="42" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Gemini/OAI</text>
      </g>
      <g transform="translate(312, 0)">
        <rect width="68" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="34" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">OpenCV</text>
      </g>
      <g transform="translate(386, 0)">
        <rect width="64" height="22" rx="4" fill="#1c160c" stroke="#382d1c" />
        <text x="32" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">SQLite</text>
      </g>
    </g>

    <!-- Status Badge -->
    <g transform="translate(0, 116)">
      <rect width="145" height="20" rx="4" fill="#261a06" stroke="#f59e0b" stroke-opacity="0.4" />
      <text x="8" y="14" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#fbbf24">🔒 PRIVATE REPOSITORY</text>
      <text x="156" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-style="italic" fill="#a8a29e">• Proprietary core &amp; architecture</text>
    </g>
