<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%">
  <defs>
    <linearGradient id="cyan-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow-text" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="145" fill="transparent" />

  <!-- Big Bold Brand Title -->
  <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="54" font-weight="900" fill="url(#cyan-title-grad)" letter-spacing="3" filter="url(#glow-text)">
    PARV LABS
  </text>

  <!-- Subtitle -->
  <g transform="translate(14, 110)">
    <text x="0" y="0" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Cyber Developer <tspan fill="#38bdf8">•</tspan> Autonomous AI Systems <tspan fill="#38bdf8">•</tspan> Security Tooling
    </text>
    <rect x="710" y="-14" width="9" height="17" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>