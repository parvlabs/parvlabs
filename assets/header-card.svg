<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142132" />
      <stop offset="50%" stop-color="#0f1925" />
      <stop offset="100%" stop-color="#09111c" />
    </linearGradient>
    <linearGradient id="cyan-glow-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hud-header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#182638" />
      <stop offset="100%" stop-color="#101a26" />
    </linearGradient>
    <pattern id="hero-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <filter id="text-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="180" rx="8" fill="url(#hero-bg)" />
  <rect width="850" height="180" rx="8" fill="url(#hero-grid)" />
  <rect x="0.5" y="0.5" width="849" height="179" rx="7.5" fill="none" stroke="#22364f" stroke-width="1.2" />
  <path d="M 0 0 L 850 0" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Left Side: Typography -->
  <g transform="translate(36, 24)">
    <!-- Terminal Pill -->
    <g transform="translate(0, 0)">
      <rect width="216" height="22" rx="4" fill="#09111c" stroke="#22364f" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#38bdf8" />
      <text x="22" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">
        PARV LABS // SEC_CORE
      </text>
    </g>

    <!-- Big Bold Brand Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="44" font-weight="900" fill="url(#cyan-glow-text)" letter-spacing="2" filter="url(#text-glow)">
      PARV LABS
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="102" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f0f9ff" letter-spacing="0.3">
      Cyber Developer <tspan fill="#38bdf8">&#8226;</tspan> Autonomous AI Systems <tspan fill="#38bdf8">&#8226;</tspan> Security Tooling
    </text>

    <!-- Mission Brief -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
      Building zero-trust infrastructure, LLM security firewalls, and self-hosted tools.
    </text>
  </g>

  <!-- Right Side: Cyber Status Telemetry HUD -->
  <g transform="translate(635, 20)">
    <!-- HUD Container -->
    <rect width="180" height="140" rx="8" fill="#09111c" stroke="#22364f" stroke-width="1.2" />
    <rect x="0.5" y="0.5" width="179" height="28" rx="7.5" fill="url(#hud-header-bg)" />
    <path d="M 0 28 L 180 28" stroke="#22364f" stroke-width="1" />

    <!-- Status Header -->
    <circle cx="14" cy="14" r="3.5" fill="#22c55e" />
    <text x="24" y="18" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
      TELEMETRY // LIVE
    </text>

    <!-- Metrics Rows -->
    <g transform="translate(14, 46)">
      <text x="0" y="0" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">OPERATOR ID</text>
      <text x="0" y="14" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#f0f9ff">PARVEER YADAV</text>

      <text x="0" y="34" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">SECURITY STATUS</text>
      <text x="0" y="48" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#22c55e">AIR-GAPPED &#183; SECURE</text>

      <text x="0" y="68" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.5">THREAT POSTURE</text>
      <text x="0" y="82" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">DEFCON-1 // HARDENED</text>
    </g>
  </g>
</svg>
